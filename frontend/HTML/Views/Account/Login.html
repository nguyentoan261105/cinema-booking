<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập - Cinema Booking</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS chung -->
    <link rel="stylesheet" href="../../../CSS/site.css">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #111827, #1f2937);
            font-family: Arial, sans-serif;
        }

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .login-box {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-logo i {
            font-size: 50px;
            color: #e50914;
        }

        .login-logo h2 {
            margin-top: 10px;
            font-weight: 700;
            color: #222;
        }

        .login-logo p {
            color: #777;
            margin-bottom: 0;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control {
            height: 48px;
            border-radius: 10px;
        }

        .form-control:focus {
            border-color: #e50914;
            box-shadow: 0 0 0 0.2rem rgba(229, 9, 20, 0.15);
        }

        .btn-login {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 10px;
            background: #e50914;
            color: white;
            font-weight: 600;
            font-size: 16px;
            transition: 0.2s;
        }

        .btn-login:hover {
            background: #b20710;
            color: white;
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            color: #666;
        }

        .register-link a {
            color: #e50914;
            font-weight: 600;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .back-home {
            text-align: center;
            margin-top: 15px;
        }

        .back-home a {
            color: #666;
            text-decoration: none;
        }

        .back-home a:hover {
            color: #e50914;
        }

        #loginMessage {
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="login-page">

        <div class="login-box">

            <!-- Logo -->
            <div class="login-logo">

                <i class="bi bi-film"></i>

                <h2>Đăng nhập</h2>

                <p>Đăng nhập vào tài khoản Cinema Booking</p>

            </div>


            <!-- Form đăng nhập -->
            <form id="loginForm">

                <!-- Email -->
                <div class="mb-3">

                    <label for="email" class="form-label">
                        Email
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-envelope"></i>
                        </span>

                        <input
                            type="email"
                            id="email"
                            class="form-control"
                            placeholder="Nhập email"
                            required
                        >

                    </div>

                </div>


                <!-- Mật khẩu -->
                <div class="mb-3">

                    <label for="password" class="form-label">
                        Mật khẩu
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>

                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            placeholder="Nhập mật khẩu"
                            required
                        >

                    </div>

                </div>


                <!-- Thông báo -->
                <div
                    id="loginMessage"
                    class="alert"
                    style="display: none;"
                >
                </div>


                <!-- Nút đăng nhập -->
                <button
                    type="submit"
                    class="btn-login"
                >
                    <i class="bi bi-box-arrow-in-right"></i>
                    Đăng nhập
                </button>

            </form>


            <!-- Đăng ký -->
            <div class="register-link">

                Chưa có tài khoản?

                <a href="Register.html">
                    Đăng ký ngay
                </a>

            </div>


            <!-- Về trang chủ -->
            <div class="back-home">

                <a href="../Home/Index.html">

                    <i class="bi bi-house"></i>
                    Về trang chủ

                </a>

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS đăng nhập -->
    <script src="../../../JS/login.js"></script>

</body>

</html>
